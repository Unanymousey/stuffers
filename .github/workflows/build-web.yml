name: Build AGS Web Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure (Emscripten)
        run: |
          mkdir build-web
          cd build-web
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build-web
          emmake make -j$(nproc)

      - name: Package output
        run: |
          mkdir -p output
          find build-web -name "*.html" -o -name "*.js" -o -name "*.wasm" -o -name "*.data" | xargs -I{} cp {} output/ || true
          cp webgame/* output/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ags-web-build
          path: output/
