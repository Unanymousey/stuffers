name: Build AGS Web Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Configure (Emscripten)
        run: |
          mkdir build-web
          cd build-web
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build-web
          emmake make -j$(nproc)

      - name: Download game data
        run: |
          mkdir -p webgame
          curl -L "https://github.com/Unanymousey/stuffers/releases/download/endacopia/acsetup.cfg" -o webgame/acsetup.cfg
          curl -L "https://github.com/Unanymousey/stuffers/releases/download/endacopia/audio.vox" -o webgame/audio.vox
          curl -L "https://github.com/Unanymousey/stuffers/releases/download/endacopia/Endacopia.ags" -o webgame/Endacopia.ags
          curl -L "https://github.com/Unanymousey/stuffers/releases/download/endacopia/sp_speechsounds.vox" -o webgame/sp_speechsounds.vox
          cp webgame/Endacopia.ags webgame/game.ags

      - name: Package output
        run: |
          mkdir -p output
          find build-web -name "*.html" -o -name "*.js" -o -name "*.wasm" -o -name "*.data" | xargs -I{} cp {} output/ || true
          cp webgame/* output/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ags-web-build
          path: output/
